resources:
  db:
    type: mariadb
    options:
      storage: 2
  redis:
    type: redis

environment:
  # Go runtime (FrankenPHP) - set to ~90% of memory limit
  - GOMEMLIMIT=920MiB

  - APP_NAME=MY_APP
  - APP_ENV=production
  - APP_DEBUG=false
  - APP_URL=https://${APP_DOMAIN}
  - APP_KEY
  - DB_CONNECTION
  - DB_URL

  # AWS
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_BUCKET
  - AWS_URL
  - AWS_DEFAULT_REGION=eu-west-1
  - AWS_USE_PATH_STYLE_ENDPOINT=true

  # Drivers
  - CACHE_STORE
  - QUEUE_CONNECTION
  - LOG_CHANNEL=stderr
  # Stock config/database.php reads this. Container env wins over .env.
  - REDIS_PERSISTENT=true

  # Support for multiple server instances
  - APP_MAINTENANCE_DRIVER=cache
  # Keeping this empty will default to cache store
  - APP_MAINTENANCE_STORE=

  - COMPOSER_AUTH

services:
  app:
    domain: ${APP_DOMAIN}
    build:
      manifest: Dockerfile
    environment:
      - RUN_MIGRATIONS=true
    health:
      grace: 30
      interval: 10
      path: /up
      timeout: 4
    liveness:
      path: /up
      grace: 60
      interval: 10
      timeout: 4
      failureThreshold: 6
    internal: false
    port: 8080
    lifecycle:
      preStop: "sleep 5"
    termination:
      grace: 75
    timeout: 60
    resources:
      - db
      - redis
    scale:
      count: 1-30
      targets:
        cpu: 70
        memory: 90
      cpu: 250
      memory: 1024

  worker:
    build:
      manifest: Dockerfile
    command: php artisan queue:work --tries=3 --timeout=60 --max-time=86400 --max-jobs=1000
    environment:
      - RUN_MIGRATIONS=false
    internal: true
    health:
      disable: true
    termination:
      grace: 70
    resources:
      - db
      - redis
    scale:
      count: 1
      cpu: 250
      memory: 1024

  scheduler:
    build:
      manifest: Dockerfile
    command: php artisan schedule:work --whisper
    environment:
      - RUN_MIGRATIONS=false
    internal: true
    health:
      disable: true
    termination:
      grace: 45
    resources:
      - db
      - redis
    scale:
      count: 1
      cpu: 120
      memory: 256
