resources:
  db:
    type: mariadb
    options:
      version: "12"
      storage: 2
  redis:
    type: redis
    image: valkey/valkey:9

environment:
  - APP_NAME=MY_APP
  - APP_ENV=production
  - APP_DEBUG=false
  - APP_URL=https://${APP_DOMAIN}
  - APP_KEY
  - DB_CONNECTION

  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_BUCKET
  - AWS_URL
  - AWS_DEFAULT_REGION=eu-west-1
  - AWS_USE_PATH_STYLE_ENDPOINT=true

  - CACHE_STORE
  - QUEUE_CONNECTION=sqs
  - SQS_PREFIX
  - SQS_QUEUE
  - LOG_CHANNEL=stderr
  - REDIS_PERSISTENT=true

  - APP_MAINTENANCE_DRIVER=cache
  # Empty, not omitted: falls back to CACHE_STORE
  - APP_MAINTENANCE_STORE=

  - COMPOSER_AUTH

# Convox drops YAML merge keys (`<<:`), so services alias each key
x-shared:
  resources: &resources
    - db
    - redis
  securityContext: &securityContext
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile: RuntimeDefault
  deployment: &deployment
    progressDeadline: 300
    crashRestartLimit: 1
  volumeOptions: &volumeOptions
    - emptyDir:
        id: tmp
        mountPath: /tmp
    - emptyDir:
        id: storage
        mountPath: /app/storage
    - emptyDir:
        id: bootstrap-cache
        mountPath: /app/bootstrap/cache
    - emptyDir:
        id: home
        mountPath: /home/nobody

services:
  app:
    domain: ${APP_DOMAIN}
    port: 8080
    environment:
      - RUN_MIGRATIONS=true
    resources: *resources
    securityContext: *securityContext
    volumeOptions: *volumeOptions
    deployment: *deployment
    startupProbe:
      path: /up
      interval: 5
      failureThreshold: 24
    health:
      grace: 5
      interval: 10
      path: /up
      timeout: 4
    liveness:
      path: /up
      grace: 5
      interval: 10
      timeout: 4
      failureThreshold: 6
    lifecycle:
      preStop: "sleep 5"
    termination:
      grace: 75
    scale:
      count: 1-30
      autoscale:
        cpu:
          threshold: 70
        memory:
          threshold: 90
      cpu: 250
      memory: 1024

  queue:
    command: php artisan queue:work --tries=3 --timeout=60 --max-time=86400 --max-jobs=1000 --memory=128
    internal: true
    environment:
      - RUN_MIGRATIONS=false
      - PHP_MEMORY_LIMIT=256M
    resources: *resources
    securityContext: *securityContext
    volumeOptions: *volumeOptions
    deployment: *deployment
    termination:
      grace: 70
    scale:
      count: 0-1
      autoscale:
        custom:
          - type: aws-sqs-queue
            metadata:
              queueURL: ${SQS_PREFIX}/${SQS_QUEUE}
              awsRegion: eu-west-1
              queueLength: "1"
      cpu: 250
      memory: 320

  scheduler:
    command: sh -c "php artisan schedule:list && exec php artisan schedule:work --whisper"
    internal: true
    environment:
      - RUN_MIGRATIONS=false
    resources: *resources
    securityContext: *securityContext
    volumeOptions: *volumeOptions
    deployment: *deployment
    termination:
      grace: 45
    scale:
      count: 1
      cpu: 120
      memory: 256
