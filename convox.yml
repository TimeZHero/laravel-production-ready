resources:
  db:
    type: mariadb
    options:
      storage: 2
  redis:
    type: redis

environment:
  - APP_NAME=MY_APP
  - APP_ENV=production
  - APP_DEBUG=false
  - APP_URL=https://${APP_DOMAIN}
  - APP_KEY
  - DB_CONNECTION

  # AWS
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_BUCKET
  - AWS_URL
  - AWS_DEFAULT_REGION=eu-west-1
  - AWS_USE_PATH_STYLE_ENDPOINT=true

  # Drivers
  - CACHE_STORE
  - QUEUE_CONNECTION
  - LOG_CHANNEL=stderr
  # Stock config/database.php reads this. Container env wins over .env.
  - REDIS_PERSISTENT=true

  # Support for multiple server instances
  - APP_MAINTENANCE_DRIVER=cache
  # Keeping this empty will default to cache store
  - APP_MAINTENANCE_STORE=

  - COMPOSER_AUTH

# Settings every service aliases. Convox ignores YAML merge keys (`<<:`), so each key is aliased on its own
x-shared:
  resources: &resources
    - db
    - redis
  securityContext: &securityContext
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile: RuntimeDefault
  # Roll a deploy back fast instead of waiting 50 minutes. See the README's "Deploy Failure Detection"
  deployment: &deployment
    progressDeadline: 300
    crashRestartLimit: 1
  # The only writable paths. FrankenPHP also needs /config and /data
  volumeOptions: &volumeOptions
    - emptyDir:
        id: tmp
        mountPath: /tmp
    - emptyDir:
        id: storage
        mountPath: /app/storage
    - emptyDir:
        id: bootstrap-cache
        mountPath: /app/bootstrap/cache
    - emptyDir:
        id: home
        mountPath: /home/nobody

services:
  app:
    domain: ${APP_DOMAIN}
    port: 8080
    environment:
      - RUN_MIGRATIONS=true
    resources: *resources
    securityContext: *securityContext
    volumeOptions: *volumeOptions
    deployment: *deployment
    # Holds off health and liveness while the entrypoint migrates: ~125s from container start, the boot-time migration limit
    startupProbe:
      path: /up
      grace: 5
      interval: 5
      timeout: 4
      failureThreshold: 24
    health:
      grace: 5
      interval: 10
      path: /up
      timeout: 4
    liveness:
      path: /up
      grace: 5
      interval: 10
      timeout: 4
      failureThreshold: 6
    lifecycle:
      preStop: "sleep 5"
    termination:
      grace: 75
    timeout: 60
    scale:
      count: 1-30
      targets:
        cpu: 70
        memory: 90
      cpu: 250
      memory: 1024

  queue:
    command: php artisan queue:work --tries=3 --timeout=60 --max-time=86400 --max-jobs=1000 --memory=128
    internal: true
    environment:
      - RUN_MIGRATIONS=false
      - PHP_MEMORY_LIMIT=256M
    resources: *resources
    securityContext: *securityContext
    volumeOptions: *volumeOptions
    deployment: *deployment
    health:
      disable: true
    termination:
      grace: 70
    scale:
      count: 1
      cpu: 250
      memory: 320

  scheduler:
    command: sh -c "php artisan schedule:list && exec php artisan schedule:work --whisper"
    internal: true
    environment:
      - RUN_MIGRATIONS=false
    resources: *resources
    securityContext: *securityContext
    volumeOptions: *volumeOptions
    deployment: *deployment
    health:
      disable: true
    termination:
      grace: 45
    scale:
      count: 1
      cpu: 120
      memory: 256
