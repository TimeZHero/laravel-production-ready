# ============================================================================
# THIS IS NOT A STANDALONE COMPOSE FILE.
#
# It is supposed to be merged into your project's existing compose.yaml
#
# (the one generated by Laravel Sail, which already defines MySQL, Redis, etc.)
# ============================================================================

services:
    laravel.test:
        build:
            dockerfile: Dockerfile
            target: development
            args:
                ENGINE: 'fpm'
                USER: 'sail'
                WWWUSER: '${WWWUSER:-1000}'
                COMPOSER_AUTH: '${COMPOSER_AUTH:-}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            APP_ENV: '${APP_ENV:-local}'
            APP_URL: 'https://${COMPOSE_PROJECT_NAME}.localhost'
            SESSION_DOMAIN: '${COMPOSE_PROJECT_NAME}.localhost'
            COMPOSER_AUTH: '${COMPOSER_AUTH:-}'
            VITE_DEV_SERVER_URL: 'https://vite.${COMPOSE_PROJECT_NAME}.localhost'
        volumes:
            - '.:/app'
            - '/app/.git'
        labels:
            caddy: '${COMPOSE_PROJECT_NAME}.localhost'
            caddy.reverse_proxy: '{{upstreams 8080}}'
            caddy_1: 'vite.${COMPOSE_PROJECT_NAME}.localhost'
            caddy_1.reverse_proxy: '{{upstreams 5173}}'
        networks:
            - sail
            - caddy

networks:
    caddy:
        external: true
