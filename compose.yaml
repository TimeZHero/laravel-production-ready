# ============================================================================
# THIS IS NOT A STANDALONE COMPOSE FILE.
#
# It only contains the `laravel.test` service configuration relevant to this
# Docker setup. Merge these values into your project's existing compose.yaml
# (the one generated by Laravel Sail, which already defines MySQL, Redis, etc.)
#
# Do NOT add other services here — they belong in your project's compose file.
# ============================================================================

services:
    laravel.test:
        build:
            dockerfile: Dockerfile
            target: development
            args:
                ENGINE: 'fpm'
                USER: 'sail'
                WWWUSER: '${WWWUSER:-1000}'
                COMPOSER_AUTH: '${COMPOSER_AUTH}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:8080'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            APP_ENV: '${APP_ENV:-local}'
            COMPOSER_AUTH: '${COMPOSER_AUTH:-}'
        volumes:
            - '.:/app'
            - '/app/.git'
        tty: true
