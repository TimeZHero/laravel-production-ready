[global]
error_log = /dev/stderr

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 1000

request_terminate_timeout = 60s

; Workers read their configuration from the container environment
clear_env = no

; PHP errors already reach the logs through FastCGI; yes would log them twice
catch_workers_output = no

security.limit_extensions = .php
