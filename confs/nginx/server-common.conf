listen 8080;
listen [::]:8080;
server_name _;

root /app/public;
index index.php;

charset utf-8;
absolute_redirect off;
error_page 404 /index.php;

include /etc/nginx/security-headers.conf;

# Security: deny dotfiles (except .well-known for ACME/SSL)
location ~ /\.(?!well-known).* {
    deny all;
}

# Vite content-hashed build output: a URL never changes content, so browsers
# can skip revalidation. Plain prefix (not ^~) so the dotfile rule still wins.
location /build/assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Static: suppress logging for common requests
location ~* ^/(favicon\.ico|robots\.txt)$ {
    access_log off;
    log_not_found off;
}
